<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emprestimos Biblioteca</title>
    <link rel="stylesheet" href="./css/emprestimo.css">
</head>

<body>

    <main class="container">
        <!-- Cabecalho da pagina e contador de emprestimos -->
        <div class="title-container">
            <h1 id="titulo-pagina">Emprestimos Biblioteca</h1>
            <span id="badge-total" class="badge">Emprestimos - 0 registros</span>
        </div>

        <nav class="top-actions">
            <a href="./livros.html" class="nav-button">Livros</a>
            <a href="./cliente.html" class="nav-button">Clientes</a>
            <a href="./emprestimo.html" class="nav-button">Empréstimos</a>
            <a href="./devolucao.html" class="nav-button">Devoluções</a>
            <a href="./login.html" class="nav-button nav-danger">Sair</a>
            
        </nav>

        <!-- Formulario de registro de emprestimo -->
        <section class="card">
            <h2 id="titulo-form">Registrar Emprestimo</h2>
            <form id="form-emprestimo" class="form-grid">
                <div class="input-group">
                    <label for="cliente">Cliente *</label>
                    <select id="cliente" required>
                        <option value="">Selecione um cliente</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="livro">Livro *</label>
                    <select id="livro" required>
                        <option value="">Selecione um livro</option>
                    </select>
                    <small id="livro-disponivel" style="display: block; margin-top: 5px;"></small>
                </div>

                <div class="input-group">
                    <label for="diasPermitidos">Dias permitidos *</label>
                    <input type="number" id="diasPermitidos" placeholder="Dias permitidos" required min="1" value="7">
                </div>

                <div class="input-group">
                    <label for="multaDiaria">Valor Multa Diária (R$)</label>
                    <input type="number" id="multaDiaria" name="multaDiaria" step="0.01" min="0"
                        placeholder="Deixe em branco para usar o valor padrão do livro">
                    <small>Opcional - Se não preencher, usará o valor cadastrado no livro</small>
                </div>

                <div class="input-group">
                    <label for="status">Status</label>
                    <select id="status">
                        <option value="EM_ANDAMENTO">Em andamento</option>
                        <option value="PENDENTE">Reserva pendente</option>
                    </select>
                </div>

                <div class="button-container full-width">
                    <button type="submit" id="btn-salvar" class="btn-save">Registrar Emprestimo</button>
                    <button type="button" id="btn-limpar" class="btn-cancel"
                        onclick="resetarFormulario()">Limpar</button>
                </div>
            </form>
        </section>

        <!-- Tabela com os emprestimos registrados -->
        <section class="card">
            <h2>Emprestimos</h2>
            <div class="table-container">
                <table id="tabela-emprestimos" class="books-table">
                    <thead>
                        <tr>
                            <th class="text-center">ID</th>
                            <th class="text-left">CLIENTE</th>
                            <th class="text-left">LIVRO</th>
                            <th class="text-center">DATA</th>
                            <th class="text-center">PREVISAO</th>
                            <th class="text-center">ENTREGA</th>
                            <th class="text-center">DIAS</th>
                            <th class="text-center">STATUS</th>
                            <th class="text-center">MULTA</th>
                            <th class="text-center">AÇÕES</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-emprestimos-body">
                        <tr>
                            <td colspan="10" class="text-center">Carregando...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="./js/emprestimo.js"></script>
</body>

</html>
