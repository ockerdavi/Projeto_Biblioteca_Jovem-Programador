<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Biblioteca</title>
    <link rel="stylesheet" href="./css/livros.css">
</head>
<body>

    <nav class="top-actions">
        <a href="./livros.html" class="nav-button">Livros</a>
        <a href="./cliente.html" class="nav-button">Alunos</a>
        <a href="./login.html" class="nav-button">Login</a>
        <button type="button" class="nav-button nav-danger" onclick="fecharTela()">Fechar</button>
    </nav>

    <main class="container">
        <div class="title-container">
            <h1 id="titulo-pagina">Dashboard Biblioteca</h1>
            <span id="badge-total" class="badge">Acervo - 0 títulos</span>
        </div>

        <section id="area-notificacoes-aluno" class="card hidden">
            <h2>Minhas notificacoes</h2>
            <ul id="lista-notificacoes-aluno" class="notification-list"></ul>
        </section>

        <section id="area-busca-aluno" class="card hidden">
            <h2>Pesquisar Livro</h2>
            <div class="input-group full-width">
                <label for="busca-livro">Titulo, autor ou categoria</label>
                <input type="text" id="busca-livro" placeholder="Pesquisar livro para reservar">
            </div>
        </section>

        <section id="area-form-livro" class="card">
            <h2 id="titulo-form">Cadastrar Livro</h2>
            <form id="form-livro" class="form-grid">
                <input type="hidden" id="livro-id">

                <div class="input-group full-width">
                    <label for="titulo">Título</label>
                    <input type="text" id="titulo" placeholder="Título" required>
                </div>
                
                <div class="input-group">
                    <label for="isbn">ISBN</label>
                    <input type="text" id="isbn" placeholder="ISBN" required>
                </div>
                
                <div class="input-group">
                    <label for="autor">Autor</label>
                    <input type="text" id="autor" placeholder="Autor" required>
                </div>
                
                <div class="input-group">
                    <label for="categoria">Categoria</label>
                    <input type="text" id="categoria" placeholder="Categoria" required>
                </div>
                
                <div class="input-group">
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade" placeholder="Quantidade" required min="1">
                </div>

                <div class="button-container full-width">
                    <button type="submit" id="btn-salvar" class="btn-save">Salvar</button>
                    <button type="button" id="btn-cancelar" class="btn-cancel" onclick="resetarFormulario()" style="display: none;">Cancelar</button>
                </div>
            </form>
        </section>

        <section id="area-reservas-bibliotecario" class="card hidden">
            <h2>Reservas dos Alunos</h2>
            <div class="table-container">
                <table class="books-table">
                    <thead>
                        <tr>
                            <th class="text-center">ID</th>
                            <th class="text-left">ALUNO</th>
                            <th class="text-left">LIVRO</th>
                            <th class="text-center">STATUS</th>
                            <th class="text-center">VALIDADE</th>
                            <th class="text-center">ACOES</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-reservas-body">
                    </tbody>
                </table>
            </div>
        </section>

        <section class="card">
            <h2>Livros</h2>
            <div class="table-container">
                <table id="tabela-livros" class="books-table">
                    <thead>
                        <tr>
                            <th class="text-center">ID</th>
                            <th class="text-left">TÍTULO</th>
                            <th class="text-center">DISPONÍVEIS</th>
                            <th class="text-center">ALUGADOS</th>
                            <th class="text-center">AÇÕES</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>
        </section>
    </main>

  <script src="./js/livros.js"></script>
  <script src="./js/nav.js"></script>
</body>
</html>
