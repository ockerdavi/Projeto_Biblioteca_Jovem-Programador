<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes Biblioteca</title>
    <link rel="stylesheet" href="./css/cliente.css">
</head>
<body>

    <nav class="top-actions">
        <a href="./livros.html" class="nav-button">Livros</a>
        <a href="./cliente.html" class="nav-button">Alunos</a>
        <a href="./login.html" class="nav-button">Login</a>
        <button type="button" class="nav-button nav-danger" onclick="fecharTela()">Fechar</button>
    </nav>

    <main class="container">
        <!-- Cabecalho da pagina e contador de clientes cadastrados -->
        <div class="title-container">
            <h1 id="titulo-pagina">Clientes Biblioteca</h1>
            <span id="badge-total" class="badge">Clientes - 0 cadastrados</span>
        </div>

        <!-- Cartao exclusivo do aluno com foto e dados pessoais -->
        <section id="perfil-aluno-card" class="card hidden">
            <div class="profile-panel">
                <div id="perfil-aluno-avatar" class="profile-avatar">AL</div>
                <div>
                    <h2 id="perfil-aluno-nome">Meus dados</h2>
                    <p id="perfil-aluno-email">Atualize suas informacoes cadastrais.</p>
                </div>
            </div>
        </section>

        <!-- Formulario de cadastro e edicao de cliente -->
        <section id="form-cliente-card" class="card">
            <h2 id="titulo-form">Cadastrar Cliente</h2>
            <form id="form-cliente" class="form-grid">
                <input type="hidden" id="cliente-id">

                <div class="input-group full-width">
                    <label for="nome-completo">Nome completo *</label>
                    <input type="text" id="nome-completo" placeholder="Nome completo" required>
                </div>

                <div class="input-group">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" placeholder="Telefone">
                </div>

                <div class="input-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" placeholder="Email" required>
                </div>

                <div class="input-group">
                    <label for="senha">Senha *</label>
                    <input type="password" id="senha" placeholder="Senha" required>
                </div>

                <div class="input-group">
                    <label for="cpf">CPF *</label>
                    <input type="text" id="cpf" placeholder="CPF" required>
                </div>

                <div class="input-group full-width">
                    <label for="perfil">Perfil *</label>
                    <select id="perfil" required>
                        <option value="">Selecione o perfil</option>
                        <option value="ALUNO">Aluno</option>
                        <option value="BIBLIOTECARIO">Bibliotecário</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="cep">CEP *</label>
                    <input type="text" id="cep" placeholder="CEP" required>
                </div>

                <div class="input-group">
                    <label for="rua">Rua *</label>
                    <input type="text" id="rua" placeholder="Rua" required>
                </div>

                <div class="input-group">
                    <label for="numero-casa">Número da casa *</label>
                    <input type="text" id="numero-casa" placeholder="Número da casa" required>
                </div>

                <div class="input-group full-width">
                    <label for="referencia">Referência</label>
                    <input type="text" id="referencia" placeholder="Referência (opcional)">
                </div>

                <div class="button-container full-width">
                    <button type="submit" id="btn-salvar" class="btn-save">Salvar</button>
                    <button type="button" id="btn-cancelar" class="btn-cancel" onclick="resetarFormulario()" style="display: none;">Cancelar</button>
                </div>
            </form>
        </section>

        <!-- Tabela com os clientes vindos do backend -->
        <section id="lista-clientes-card" class="card">
            <h2>Clientes</h2>
            <div class="table-container">
                <table id="tabela-clientes" class="books-table">
                    <thead>
                        <tr>
                            <th class="text-center">ID</th>
                            <th class="text-left">NOME</th>
                            <th class="text-center">TELEFONE</th>
                            <th class="text-left">EMAIL</th>
                            <th class="text-center">PERFIL</th>
                            <th class="text-center">CPF</th>
                            <th class="text-center">CEP</th>
                            <th class="text-left">ENDERECO</th>
                            <th class="text-center">ACOES</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="./js/cliente.js"></script>
    <script src="./js/nav.js"></script>
</body>
</html>
