<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Biblioteca</title>
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>

   
    <main class="login-page">
        <section class="login-hero" aria-hidden="true">
            <div class="hero-copy">
                <div class="hero-kicker">Biblioteca</div>
                <h1>Bem-vindo à Biblioteca</h1>
                <p>Área de acesso — entre ou cadastre-se para utilizar os serviços.</p>
            </div>
            <div class="library-art" aria-hidden="true"></div>
        </section>

        <section class="auth-card">
            <div class="tab-group">
                <button id="tab-login" class="tab-button active" type="button" onclick="mostrarAba('login')">Login</button>
                <button id="tab-cadastro" class="tab-button" type="button" onclick="mostrarAba('cadastro')">Cadastro</button>
            </div>

            <form id="form-login" class="auth-form">
                <h2>Entrar</h2>
                <div class="input-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="input-group">
                    <label for="login-senha">Senha</label>
                    <input type="password" id="login-senha" required>
                </div>
                <div class="input-group">
                    <label for="login-perfil">Perfil</label>
                    <select id="login-perfil">
                        <option value="ALUNO">Aluno</option>
                        <option value="BIBLIOTECARIO">Bibliotecário</option>
                    </select>
                </div>
                <div id="grupo-modulo-bibliotecario" class="input-group hidden">
                    <label for="login-modulo">Módulo (bibliotecário)</label>
                    <select id="login-modulo">
                        <option value="cliente.html">Clientes (Dashboard)</option>
                        <option value="livros.html">Livros (Gerenciar acervo)</option>
                    </select>
                </div>
                <div class="button-container">
                    <button type="submit" class="btn-save">Entrar</button>
                </div>
            </form>

            <form id="form-cadastro" class="auth-form hidden">
                <h2>Cadastrar</h2>
                <div class="input-group">
                    <label for="cadastro-nome">Nome completo</label>
                    <input type="text" id="cadastro-nome" required>
                </div>
                <div class="input-group">
                    <label for="cadastro-email">Email</label>
                    <input type="email" id="cadastro-email" required>
                </div>
                <div class="input-group">
                    <label for="cadastro-cpf">CPF</label>
                    <input type="text" id="cadastro-cpf" required placeholder="000.000.000-00">
                </div>
                <div class="input-group">
                    <label for="cadastro-whatsapp">WhatsApp</label>
                    <input type="text" id="cadastro-whatsapp">
                </div>
                <div class="input-group">
                    <label for="cadastro-instituicao">Instituição</label>
                    <input type="text" id="cadastro-instituicao">
                </div>
                <div class="input-group">
                    <label for="cadastro-senha">Senha</label>
                    <input type="password" id="cadastro-senha" required>
                </div>
                <div class="input-group">
                    <label for="cadastro-perfil">Perfil</label>
                    <select id="cadastro-perfil">
                        <option value="ALUNO">Aluno</option>
                        <option value="BIBLIOTECARIO">Bibliotecário</option>
                    </select>
                </div>
                <div id="grupo-codigo-bibliotecario" class="input-group hidden">
                    <label for="codigo-bibliotecario">Código bibliotecário</label>
                    <input type="text" id="codigo-bibliotecario">
                </div>


                <button type="submit" class="btn-save">Cadastrar</button>
            </form>
        </section>
    </main>

    <script src="./js/login-ui.js"></script>
    <script src="./js/login.js"></script>
    <script src="./js/nav.js"></script>
</body>
</html>
